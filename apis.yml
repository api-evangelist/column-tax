aid: column-tax
name: Column Tax
description: 'Column Tax is an IRS-authorized, API-first tax filing platform that lets banks, brokerages,
  neobanks, and SMB/freelancer fintech apps embed a full white-label income-tax preparation and e-file
  experience directly inside their own product. Partners create a Column Tax user via a server-side REST
  call, receive a short-lived authenticated URL, and launch the Column Tax UI (web loader or native iOS,
  Android, and React Native SDKs) embedded in their app, while webhooks report each user through the
  filing lifecycle. Column Tax offers DIY Filing and Expert Review products, is a SOC 2-certified and
  IRS-authorized e-file provider, and reports outcomes such as higher retention and direct-deposit
  switching for embedded partners.'
